<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      rel="shortcut icon"
      href="assets/images/faviconbc.jpeg"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style/style.css" />
  </head>
  <body>
    <div class="app-container">
      <h1 class="main-title">Expense & Budget Tracker</h1>

      <section id="total-balance" class="card">
        <h2>Total Balance</h2>
        <span id="balance">$0.00</span>
      </section>

      <section id="input-form" class="card">
        <h2>Add Transaction</h2>

        <div class="form-group">
          <label for="description">Item Name</label>
          <input type="text" id="description" placeholder="e.g. Cilok" />
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" />
        </div>

        <div class="form-group">
          <label for="type">Category</label>
          <select id="type">
            <option value="Food">Food</option>
            <option value="Drink">Drink</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button id="add-transaction">Add Transaction</button>
      </section>

      <div id="output-section">
        <section id="transaction-history" class="card">
          <h2>Transactions</h2>
          <ul id="history-list"></ul>
        </section>

        <section id="chart-section" class="card">
          <h2>Spending by Category</h2>
          <div class="chart-wrapper">
            <canvas id="chart"></canvas>
          </div>
        </section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
